# Validation gate for the app content (content/**, see content/README.md).
# Runs the unit tests that read the real content: the data validation tests
# (*ValidationTest: daily, gym, program catalog and templates) and the program
# generator tests on the real templates (domain.program: focus rules, BALANCED
# golden regression...) and the Kotlin ↔ Dart parity goldens (parity.*: shared/golden/
# program_generator.json is made from the content's program files).
name: Content validation

on:
  pull_request:
    paths:
      - "content/**"
  push:
    # main runs this same gate in content-deploy.yml before deploying
    branches-ignore:
      - main
    paths:
      - "content/**"
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate content
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Content validation tests
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests "*ValidationTest"
          --tests "com.javargasp.tiominutermvi.domain.program.*"
          --tests "com.javargasp.tiominutermvi.parity.*"

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: content-validation-report
          path: app/build/reports/tests/testDebugUnitTest/
