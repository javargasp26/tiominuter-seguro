# The Android JVM unit tests (./gradlew testDebugUnitTest), which include the Kotlin ↔ Dart parity
# check: the golden tests (app/src/test/.../parity/) fail when regenerating shared/golden/ would
# change a byte (update with scripts/update_golden.sh, then make the web's Dart port match; the web
# gate, web.yml, runs the Dart side). Never deploys.
name: Android unit tests

on:
  pull_request:
    paths:
      - "app/**"
      - "content/**"
      - "shared/golden/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-tests.yml"
  push:
    paths:
      - "app/**"
      - "content/**"
      - "shared/golden/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: testDebugUnitTest (incl. parity goldens)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
