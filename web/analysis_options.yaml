# flutter_lints plus stricter type checks; `flutter analyze` must report no issues (CI fails on
# warnings and infos too).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - lib/l10n/app_localizations*.dart
    - build/**
    - web/**

formatter:
  page_width: 120

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - unnecessary_lambdas
